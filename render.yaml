# Render Blueprint — API Paradis Immo
#
# Fichier à la RACINE du repo. Sans Blueprint appliqué, reproduire dans le dashboard :
#   Root Directory: apps/api
#   Build Command:  bun run build
#   Start Command:  bun run start:prod
#   Health Check:   /health
services:
  - type: web
    name: paradis-immo-api
    runtime: node
    rootDir: apps/api
    buildCommand: bun run build
    startCommand: bun run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Origins autorisés pour le CORS de l'API (voir apps/api/src/main.ts).
      # À définir dans le dashboard Render (sync: false) — l'origine Vercel web :
      #   https://paradis-immo.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
